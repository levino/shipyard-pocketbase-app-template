name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PocketBase
        run: |
          docker run -d --name pocketbase \
            -p 8090:8090 \
            -e PB_ADMIN_EMAIL=admin@test.local \
            -e PB_ADMIN_PASSWORD=testtest123 \
            -v "$GITHUB_WORKSPACE/pocketbase/pb_migrations:/pb_migrations" \
            ghcr.io/muchobien/pocketbase:latest \
            --migrationsDir=/pb_migrations
          sleep 3
          docker logs pocketbase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Astro 7 verlangt Node >= 22.23.4
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:bare
        env:
          POCKETBASE_URL: http://localhost:8090

      - name: Show PocketBase logs on failure
        if: failure()
        run: docker logs pocketbase

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start PocketBase
        run: |
          docker run -d --name pocketbase \
            -p 8090:8090 \
            -e PB_ADMIN_EMAIL=admin@test.local \
            -e PB_ADMIN_PASSWORD=testtest123 \
            -v "$GITHUB_WORKSPACE/pocketbase/pb_migrations:/pb_migrations" \
            ghcr.io/muchobien/pocketbase:latest \
            --migrationsDir=/pb_migrations
          sleep 3
          docker logs pocketbase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Astro 7 verlangt Node >= 22.23.4
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Astro
        run: npm run build
        env:
          POCKETBASE_URL: http://localhost:8090

      - name: Run Playwright tests
        run: npm run test:playwright:bare
        env:
          POCKETBASE_URL: http://localhost:8090
          DISABLE_AUTH: 'true'

      - name: Show PocketBase logs on failure
        if: failure()
        run: docker logs pocketbase

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Astro 7 verlangt Node >= 22.23.4
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          POCKETBASE_URL: http://pocketbase:8090
