# Development Docker Compose
# Run: docker compose up -d pocketbase-dev
# Then: npm run dev:bare

services:
  pocketbase-dev:
    image: ghcr.io/muchobien/pocketbase:latest@sha256:618171d6df039ab3edd74ef9e6b89d43ec836fd55f5437017b7ed3790e627ab0
    ports:
      - "8090:8090"
    environment:
      - PB_ADMIN_EMAIL=admin@test.local
      - PB_ADMIN_PASSWORD=testtest123
    volumes:
      - ./pocketbase/pb_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
    command: ["--automigrate", "--migrationsDir=/pb_migrations"]

  pocketbase-test:
    image: ghcr.io/muchobien/pocketbase:latest@sha256:618171d6df039ab3edd74ef9e6b89d43ec836fd55f5437017b7ed3790e627ab0
    environment:
      - PB_ADMIN_EMAIL=admin@test.local
      - PB_ADMIN_PASSWORD=testtest123
    volumes:
      - pb_data_test:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations
    command: ["--migrationsDir=/pb_migrations"]

  runner:
    image: node:22@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    working_dir: /app
    environment:
      - POCKETBASE_URL=http://pocketbase-dev:8090
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - pocketbase-dev

  playwright:
    image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    working_dir: /app
    environment:
      - POCKETBASE_URL=http://pocketbase-test:8090
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - pocketbase-test

volumes:
  node_modules:
  pb_data_test:
